<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VASTU HOME · SMM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: тёмно-зелёная боковая навигация (как правая панель обложки стратегии) + молочное рабочее поле с карточками.
   Сознательно одна светлая тема — в тон презентации и дашборда. */
:root{
  --paper:#f6f1eb;      /* фон */
  --milk:#fbf8f4;       /* карточки */
  --sand:#efe9df;       /* плашки */
  --cream:#f5e6d3;
  --line:#e5dcd0;
  --green:#3e6d65;      /* основной */
  --green-deep:#2f554e;
  --green-soft:#e3ece8;
  --copper:#9a7650;     /* надзаголовки */
  --terra:#c96f4a;
  --olive:#5f6d31;
  --ochre:#d4a06a;
  --ink:#2f2a25; --ink2:#6b6158; --ink3:#958a7e;
  --on-green:#f6f1eb; --on-green-2:#bfd2cc;
  --f-ui:Manrope,"Segoe UI",Roboto,Arial,sans-serif;
  --f-brand:Comfortaa,Manrope,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--green);color:var(--on-green);padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.logo b{font-family:var(--f-brand);font-size:22px;letter-spacing:.02em}
.logo span{font-size:12px;color:var(--on-green-2);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--on-green);text-decoration:none;font-weight:500;font-size:14.5px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:var(--paper);color:var(--green-deep);font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:12px;color:var(--on-green-2);padding:0 8px;line-height:1.45}

.main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:4px 4px 2px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
h1{margin:4px 0 0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:19px;line-height:1.3;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15.5px;font-weight:700}
.lead{color:var(--ink2);max-width:68ch;margin:6px 0 0}
.muted{color:var(--ink3)} .small{font-size:13px}
.card{background:var(--milk);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card > h2 + .sub, .card > .sub{color:var(--ink3);font-size:13.5px;margin:2px 0 14px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.band{background:var(--green);color:var(--on-green);border-radius:var(--r);padding:26px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px}
.band .eyebrow{color:var(--ochre)}
.band h1{color:var(--on-green)}
.band p{color:var(--on-green-2)}
.band-stats{display:grid;gap:14px;align-content:center}
.band-stats div{border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.band-stats small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);font-weight:700}
.band-stats b{font-size:22px;font-weight:600}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--milk);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:hover{background:var(--green-deep);color:var(--on-green)}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--terra);color:var(--terra)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--milk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--ink2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sand);color:var(--ink)}

/* list styles */
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{position:relative;padding-left:16px;line-height:1.45}
.list li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ochre)}
.list.neg li::before{background:var(--terra)}
.list.pos li::before{background:var(--olive)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:left;padding:0 12px 10px 0;white-space:nowrap}
.tbl td{padding:11px 12px 11px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr.hl td{background:var(--green-soft)}

/* stats */
.stat small{display:block;color:var(--ink2);font-size:13px}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat em{font-style:normal;font-size:13px;color:var(--ink3)}
.up{color:var(--olive)} .down{color:var(--terra)}

/* progress */
.prog{display:grid;gap:14px}
.prog-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr) auto;gap:14px;align-items:center}
.prog-row .lbl{font-size:14px;line-height:1.3}
.prog-row .lbl small{display:block;color:var(--ink3);font-size:12px}
.track{height:10px;background:var(--sand);border-radius:999px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--green);border-radius:999px}
.fill.warn{background:var(--ochre)} .fill.bad{background:var(--terra)}
.prog-row .val{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap;text-align:right;min-width:92px}
.prog-row .val small{color:var(--ink3);font-weight:500}

/* checklist */
.checks{display:grid;gap:6px}
.check{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;text-align:left;background:transparent;width:100%}
.check:hover{background:var(--sand)}
.check .box{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--ink3);display:flex;align-items:center;justify-content:center;background:var(--milk)}
.check .box svg{width:14px;height:14px;stroke:var(--on-green);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[data-st="wip"] .box{border-color:var(--ochre);background:var(--cream)}
.check[data-st="wip"] .box::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ochre)}
.check[data-st="done"] .box{background:var(--green);border-color:var(--green)}
.check[data-st="done"] .box svg{opacity:1}
.check[data-st="done"] .txt{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line)}
.check .st{font-size:12px;color:var(--ink3);white-space:nowrap;padding-top:2px}
.check[data-st="wip"] .st{color:#9a6a30;font-weight:600}
.check .txt small{display:block;color:var(--ink3);font-size:12.5px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.meter .track{flex:1;height:6px}

/* strategy */
.strat{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;background:var(--milk);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.toc button{display:grid;grid-template-columns:26px 1fr;gap:6px;text-align:left;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink2)}
.toc button b{color:var(--copper);font-variant-numeric:tabular-nums}
.toc button[aria-pressed="true"]{background:var(--green-soft);color:var(--green-deep);font-weight:700}
.sec-body{display:flex;flex-direction:column;gap:16px;min-width:0}
.quote{border-left:3px solid var(--ochre);background:var(--cream);padding:14px 18px;border-radius:0 12px 12px 0;font-weight:600;line-height:1.45}
.num-badge{font-size:12px;font-weight:800;color:var(--copper);letter-spacing:.06em}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowline span{background:var(--green-soft);color:var(--green-deep);padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:600}
.flowline i{font-style:normal;color:var(--ink3)}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.compare > div{padding:12px 14px;border-top:1px solid var(--line);font-size:14px}
.compare > div:nth-child(-n+2){border-top:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);background:var(--sand)}
.compare > div:nth-child(odd){border-right:1px solid var(--line);color:var(--ink2)}
.compare > div:nth-child(even):not(:nth-child(2)){background:var(--green-soft);color:var(--green-deep);font-weight:600}

/* content plan */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--milk);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;min-width:0}
.day.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2)}
.day-h b{font-size:15px;color:var(--ink)}
.day .add{margin-top:auto;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:6px;color:var(--ink3);cursor:pointer;font-size:13px}
.day .add:hover{border-color:var(--green);color:var(--green)}
.post{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 9px 9px;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;border-left:4px solid var(--c,var(--ink3))}
.post:hover{border-color:var(--green);border-left-color:var(--c,var(--ink3))}
.post .p-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;font-size:11.5px;color:var(--ink2);font-weight:600}
.post .p-title{font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.post .p-meta{display:flex;flex-wrap:wrap;gap:4px}
.post .p-meta .chip{font-size:11px;padding:2px 7px;white-space:normal}
.st-idea{background:var(--sand);color:var(--ink2)}
.st-prod{background:var(--cream);color:#8a5a24}
.st-ready{background:var(--green-soft);color:var(--green-deep)}
.st-pub{background:var(--green);color:var(--on-green)}
.example-mark{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--terra)}
.rhythm{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rh{background:var(--milk);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.rh h3{font-size:14px;display:flex;align-items:center;gap:7px}
.rh-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rh-line b{color:var(--ink)}
.rh-line b.ok{color:var(--olive)} .rh-line b.low{color:var(--terra)}
.fn-mix{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sand)}
.fn-mix span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--milk);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green-soft);border-color:var(--green)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--ink3)}
.warn-note{font-size:13px;color:#9a4a2a;background:#f8e6dc;padding:8px 11px;border-radius:10px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(47,42,37,.42);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:640px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(47,42,37,.25)}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* dashboard iframe */
.frame{width:100%;height:calc(100vh - 150px);min-height:640px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);display:block}

/* funnel */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:f}
.fstep{background:var(--milk);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.fstep .n{font-size:12px;font-weight:800;color:var(--copper)}
.fstep h3{font-size:15px}
.fstep p{margin:0;font-size:13.5px;color:var(--ink2)}
.fstep .m{margin-top:auto;font-size:12.5px;background:var(--green-soft);color:var(--green-deep);padding:6px 9px;border-radius:8px}
.fstep .who{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

/* brand */
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--milk);cursor:pointer;text-align:left;padding:0}
.sw .c{height:64px}
.sw div:last-child{padding:8px 10px;font-size:12.5px}
.sw b{display:block;font-size:13px}
.checker-out{background:var(--milk);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:60px}
mark.bad{background:#f6d9cb;color:#7d3618;border-radius:4px;padding:0 2px}
.found{display:grid;gap:8px}
.found div{font-size:13.5px;padding:9px 12px;border-radius:10px;background:var(--cream)}
.found b{color:#8a4426}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:14px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.out{background:var(--sand);border-radius:10px;padding:12px;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rhythm{grid-template-columns:repeat(3,minmax(0,1fr))}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .swatches{grid-template-columns:repeat(3,minmax(0,1fr))}
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{min-width:0;position:sticky;top:0;z-index:20;height:auto;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-direction:row;align-items:center;gap:14px;overflow:visible}
  .logo{padding:0;flex:none} .logo span{display:none} .logo b{font-size:17px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:7px 10px;font-size:13.5px}
  .nav svg{display:none}
  .side-foot{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .band{grid-template-columns:1fr}
  .strat{grid-template-columns:1fr}
  .toc{position:static;flex-direction:row;overflow-x:auto}
  .toc button{white-space:nowrap}
  .frame{height:calc(100vh - 120px)}
}
@media (max-width:620px){
  h1{font-size:26px}
  .g4{grid-template-columns:1fr 1fr}
  .card{padding:16px}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .rhythm{grid-template-columns:1fr 1fr}
  .funnel{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .prog-row{grid-template-columns:1fr auto}
  .prog-row .track{grid-column:1/-1;grid-row:2}
  .compare{grid-template-columns:1fr}
  .compare > div:nth-child(odd){border-right:0}
  .compare > div:nth-child(2){display:none}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo"><b>VASTU HOME</b><span>SMM-платформа</span></div>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="side-foot">Стратегия: октябрь 2026 — март 2027.<br>Данные плана и чек-листов хранятся в этом браузере. Резервная копия — во вкладке «Инструменты».</div>
  </aside>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="utm-data.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   СПРАВОЧНИКИ (из SMM-стратегии VASTU HOME)

function kpiProgress(rep){
  rep = rep || latestReport();
  return '<div class="prog">'+KPIS.map(function(k){
    var fact = rep&&rep.vals&&rep.vals[k.id]!==""&&rep.vals[k.id]!=null ? +rep.vals[k.id] : null;
    if(k.dir==="track"){
      return '<div class="prog-row"><div class="lbl">'+k.label+'<small>было: не считались · цель: считать каждый месяц</small></div><div class="track"><div class="fill" style="width:'+(fact!=null?100:0)+'%"></div></div><div class="val">'+(fact!=null?fmt(fact):'<small>нет данных</small>')+'</div></div>';
    }
    var pct, cls="";
    if(fact==null){ pct=0; }
    else if(k.dir==="up"){ pct=Math.max(0,Math.min(100,(fact-k.base)/(k.target-k.base)*100)); }
    else if(k.dir==="down"){ pct=Math.max(0,Math.min(100,(k.base-fact)/(k.base-k.target)*100)); }
    else { pct = fact>=k.target?100:Math.max(0,fact/k.target*100); }
    if(fact!=null && pct<34 && k.dir!=="keep") cls="warn";
    if(k.dir==="keep" && fact!=null && fact<k.target) cls="bad";
    var tgt = k.dir==="down" ? "ниже "+k.target+"%" : (k.dir==="keep"?"от "+fmt(k.target):fmt(k.target));
    var unit = k.unit==="%" ? "%" : "";
    return '<div class="prog-row"><div class="lbl">'+k.label+'<small>точка А: '+fmt(k.base)+unit+' · цель: '+tgt+'</small></div><div class="track"><div class="fill '+cls+'" style="width:'+(fact==null?0:Math.max(pct,3))+'%"></div></div><div class="val">'+(fact==null?'<small>нет данных</small>':fmt(fact)+unit)+'</div></div>';
  }).join("")+'</div>'+(rep?'<p class="small muted" style="margin:14px 0 0">Факт из отчёта «'+esc(rep.title)+'». Шкала идёт от точки А к цели.</p>':'');
}

function scanText(text){
  var hits=[];
  STOP.forEach(function(s){ s[0].lastIndex=0; var m; while((m=s[0].exec(text))){ hits.push({word:m[0],group:s[1],tip:s[2],i:m.index,len:m[0].length}); if(m[0].length===0) s[0].lastIndex++; } });
  return hits;
}

function runChecker(){
  var ta=document.getElementById("tc-in"); if(!ta) return;
  var text=ta.value; checkerText=text;
  var hits=scanText(text).sort(function(a,b){return a.i-b.i;});
  var out="", pos=0;
  hits.forEach(function(h){ if(h.i<pos) return; out+=esc(text.slice(pos,h.i))+'<mark class="bad" title="'+esc(h.group)+'">'+esc(text.slice(h.i,h.i+h.len))+'</mark>'; pos=h.i+h.len; });
  out+=esc(text.slice(pos));
  document.getElementById("tc-out").innerHTML=out||'<span class="muted">Вставьте текст слева</span>';
  var groups={}; hits.forEach(function(h){ (groups[h.group]=groups[h.group]||{tip:h.tip,words:[]}).words.push(h.word); });
  var keys=Object.keys(groups);
  document.getElementById("tc-found").innerHTML = keys.length ? keys.map(function(g){return '<div><b>'+esc(g)+'</b> · '+groups[g].words.map(esc).join(", ")+'<br><span class="small">'+esc(groups[g].tip)+'</span></div>';}).join("") : '<div style="background:var(--green-soft)">Спорных формулировок не найдено. Перечитайте текст глазами человека, который впервые видит проект.</div>';
}

function ddmmyyyy(d){ return String(d.getDate()).padStart(2,"0")+String(d.getMonth()+1).padStart(2,"0")+d.getFullYear(); }
function allLandings(){ return (S.landingsCustom||[]).concat(UD.landings); }
function landingByName(n){ var l=allLandings(); for(var i=0;i<l.length;i++) if(l[i][0]===n) return l[i]; return null; }
function idByUrl(url){ var l=allLandings(); for(var i=0;i<l.length;i++) if(l[i][1]===url) return l[i][2]; return ""; } /* как VLOOKUP по ссылке: первое совпадение */
function lookup(list,name){ for(var i=0;i<list.length;i++) if(list[i][0]===name) return list[i][1]; return null; }
function buildUtm(u){
  var L=landingByName(u.page); if(!L) return {err:"Выберите страницу из списка лендингов"};
  var src=lookup(UD.sources,u.src), ch=lookup(UD.channels,u.ch), tp=lookup(UD.types,u.type);
  if(!src||!ch||!tp) return {err:"Выберите источник, канал и тип контента"};
  var url=L[1];
  return {url:url, id:idByUrl(url), link: url+(url.indexOf("?")>-1?"&":"?")+"utm_source="+src+"&utm_medium="+ch+"&utm_campaign="+tp+"&utm_content="+encodeURIComponent(u.uniq.trim())+"&utm_term="+idByUrl(url)};
}
function nextGkId(){ var max=0; allLandings().forEach(function(l){ var m=/^GK(\d+)$/.exec(l[2]); if(m) max=Math.max(max,+m[1]); }); return "GK"+(max+1); }

function utmRender(){
  var r=buildUtm(U), L=landingByName(U.page);
  document.getElementById("ug-out").textContent = r.err || r.link;
  document.getElementById("ug-page-info").textContent = L ? L[1]+" · ID "+(idByUrl(L[1])||"нет") : (U.page?"Такой страницы нет в списке. Добавьте её ниже как новый лендинг":"");
  var parts=[["utm_source","Источник трафика",lookup(UD.sources,U.src)],["utm_medium","Канал привлечения",lookup(UD.channels,U.ch)],["utm_campaign","Тип контента",lookup(UD.types,U.type)],["utm_content","Уникальное поле",U.uniq.trim()],["utm_term","ID лендинга",L?idByUrl(L[1]):""]];
  document.getElementById("ug-parts").innerHTML=parts.map(function(p){return '<tr><td class="mono">'+p[0]+'</td><td class="small">'+p[1]+'</td><td class="mono"><b>'+esc(p[2]||"—")+'</b></td></tr>';}).join("");
  return r;
}
function utmTsv(rows){
  return rows.map(function(r){ return [r.page,r.url,r.src,r.ch,r.type,r.uniq,r.link,r.comment].map(function(v){return String(v||"").replace(/[\t\n]/g," ");}).join("\t"); }).join("\n");
}
AFTER.utm = function(){
  var bind={"ug-page":"page","ug-src":"src","ug-ch":"ch","ug-type":"type","ug-uniq":"uniq","ug-comment":"comment"};
  Object.keys(bind).forEach(function(id){ var el=document.getElementById(id); ["input","change"].forEach(function(ev){ el.addEventListener(ev,function(){ U[bind[id]]=el.value; utmRender(); }); }); });
  utmRender();
  document.getElementById("ug-today").addEventListener("click",function(){ U.uniq=ddmmyyyy(new Date()); document.getElementById("ug-uniq").value=U.uniq; utmRender(); });
  document.getElementById("ug-copy").addEventListener("click",function(){ var r=utmRender(); if(r.err) toast(r.err); else copy(r.link,"Ссылка скопирована"); });
  document.getElementById("ug-save").addEventListener("click",function(){
    var r=utmRender(); if(r.err){ toast(r.err); return; }
    S.utmLog=S.utmLog||[]; S.utmLog.push({id:uid(),at:new Date().toLocaleDateString("ru-RU"),page:U.page,url:r.url,src:U.src,ch:U.ch,type:U.type,uniq:U.uniq.trim(),link:r.link,comment:U.comment.trim()});
    save(); copy(r.link,"Сохранено в журнал и скопировано"); route();
  });
  document.getElementById("ug-tsv").addEventListener("click",function(){ var l=S.utmLog||[]; if(!l.length){ toast("Журнал пуст"); return; } copy(utmTsv(l),"Строки скопированы — вставьте в лист GENERATOR"); });
  if(document.getElementById("ug-clear")) armBtn("ug-clear","Точно очистить?",function(){ S.utmLog=[]; save(); route(); toast("Журнал очищен"); });
  document.getElementById("ul-add").addEventListener("click",function(){
    var n=document.getElementById("ul-name").value.trim(), u=document.getElementById("ul-url").value.trim(), id=document.getElementById("ul-id").value.trim();
    if(!n||!/^https?:\/\//.test(u)||!id){ toast("Заполните название, ссылку (с https://) и ID"); return; }
    if(landingByName(n)){ toast("Лендинг с таким названием уже есть"); return; }
    S.landingsCustom=S.landingsCustom||[]; S.landingsCustom.unshift([n,u,id]); U.page=n; save(); route(); toast("Лендинг добавлен и выбран");
  });
};

   '<dt>Таблица данных</dt><dd><a href="'+SHEET_URL+'" target="_blank" rel="noopener">Рабочая таблица SMM</a><div class="small muted">листы «еженедельно», «ежемесячно», «Контент» — их читает дашборд</div></dd>'+
   '<dt>Обновить дашборд</dt><dd class="small">Внесите цифры в таблицу и нажмите «обновить» во вкладке «Дашборд»</dd>'+
   '<dt>Отчёты</dt><dd class="small">Пн 9:30 — статистика и план недели · Пт 9:30 — итоги · раз в месяц — отчёт во вкладке «Отчёты»</dd>'+
   '<dt>UTM-метки</dt><dd class="small">Только через вкладку «UTM-метки» — по методике таблицы генератора школы</dd>'+

};
AFTER.tools = function(){
  document.getElementById("b-copy").addEventListener("click",function(){ copy(JSON.stringify(S),"Данные скопированы — сохраните их в файл или документ"); });
  document.getElementById("b-show").addEventListener("click",function(){ var b=document.getElementById("b-import"); b.hidden=!b.hidden; });
  document.getElementById("b-apply").addEventListener("click",function(){
    try{ var o=JSON.parse(document.getElementById("b-text").value); if(!o||!Array.isArray(o.plan)) throw 0; o.checks=o.checks||{}; o.reports=o.reports||[]; S=o; save(); toast("Данные загружены"); route(); }
    catch(e){ toast("Не получилось прочитать данные. Скопируйте их целиком ещё раз"); }
  });
  armBtn("b-clear-ex","Удалить примеры?",function(){ S.plan=S.plan.filter(function(p){return !p.example;}); save(); toast("Примеры удалены"); route(); });
  armBtn("b-reset","Точно сбросить всё?",function(){ S=seed(); save(); toast("Платформа сброшена к исходному виду"); route(); });
};
function armBtn(id,confirmText,fn){
  var b=document.getElementById(id);
  b.addEventListener("click",function(){ if(b.dataset.armed){ fn(); } else { b.dataset.armed="1"; b.textContent=confirmText; b.style.borderColor="var(--terra)"; b.style.color="var(--terra)"; } });
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
document.addEventListener("click",function(e){
  var t=e.target;
  var c=t.closest("[data-check]");
  if(c){ var id=c.dataset.check, st=S.checks[id]||"", nx=ST_NEXT[st]; if(nx) S.checks[id]=nx; else delete S.checks[id]; save();
    var y=window.scrollY; $page.innerHTML=VIEWS[(location.hash||"#home").slice(1)]?VIEWS[(location.hash||"#home").slice(1)]():VIEWS.home(); var h=(location.hash||"#home").slice(1); if(AFTER[h])AFTER[h](); window.scrollTo(0,y); return; }
  var s=t.closest("[data-sec]"); if(s){ stratIdx=+s.dataset.sec; try{localStorage.setItem(KEY+":sec",stratIdx);}catch(err){} route(); return; }
  var w=t.closest("[data-wk]"); if(w){ var n=+w.dataset.wk; planWeek = n===0?monday(new Date()):addDays(planWeek,7*n); route(); return; }
  var v=t.closest("[data-view]"); if(v){ planView=v.dataset.view; route(); return; }
  var nw=t.closest("[data-new]"); if(nw){ openPost({date:nw.dataset.new,status:"idea",net:"ig",format:"Reels",title:"",fn:"reach",dir:DIRS[0],code:"",link:"",note:""},true); return; }
  var ed=t.closest("[data-edit]"); if(ed){ var p=S.plan.filter(function(x){return x.id===ed.dataset.edit;})[0]; if(p) openPost(p,false); return; }
  if(t.closest("[data-close]") && (t.dataset.close || t.closest("button[data-close]"))){ closeModal(); return; }
  var rp=t.closest("[data-rep]"); if(rp){ repOpen=rp.dataset.rep; route(); return; }
  var re=t.closest("[data-rep-edit]"); if(re){ openReport(S.reports.filter(function(x){return x.id===re.dataset.repEdit;})[0],false); return; }
  var rc=t.closest("[data-rep-copy]"); if(rc){ copy(reportText(S.reports.filter(function(x){return x.id===rc.dataset.repCopy;})[0]),"Текст отчёта скопирован"); return; }
  if(t.closest("#rep-new")){ var d=new Date(), m=iso(d).slice(0,7); openReport({id:uid(),month:m,title:MONTHS_N[d.getMonth()]+" "+d.getFullYear(),vals:{},cont:"",change:"",test:"",stop:"",note:""},true); return; }
  var uc=t.closest("[data-uch]"); if(uc){ U.ch=uc.dataset.uch; document.getElementById("ug-ch").value=U.ch; document.querySelectorAll("[data-uch]").forEach(function(x){ x.style.borderColor=x===uc?"var(--green)":"transparent"; }); utmRender(); return; }
  var ulc=t.closest("[data-ulcopy]"); if(ulc){ var r=(S.utmLog||[]).filter(function(x){return x.id===ulc.dataset.ulcopy;})[0]; if(r) copy(r.link,"Ссылка скопирована"); return; }
  var uld=t.closest("[data-uldel]"); if(uld){ if(uld.dataset.armed){ S.utmLog=S.utmLog.filter(function(x){return x.id!==uld.dataset.uldel;}); save(); route(); toast("Удалено"); } else { uld.dataset.armed="1"; uld.textContent="Точно?"; } return; }
  var cp=t.closest("[data-copy]"); if(cp){ copy(cp.dataset.copy,"Цвет "+cp.dataset.copy+" скопирован"); return; }
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="f-net"||id==="f-fn"||id==="f-st"){ planFilter[{"f-net":"net","f-fn":"fn","f-st":"status"}[id]]=e.target.value; route(); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });
window.addEventListener("hashchange",route);
route();
})();
