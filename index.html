<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VASTU · аналитика</title>
<style>
  :root{
    --bg:#f7f5f6; --card:#ffffff; --line:#ece7ea; --ink:#1f1a1d; --ink-2:#6b6368; --ink-3:#9a9196;
    --accent:#a25574; --accent-soft:#f3e7ec; --accent-2:#d7a9bc; --slate:#8a94a3;
    --up:#2f8a57; --down:#9a9196; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 56px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
  .brand{font-size:30px;font-weight:700;letter-spacing:.06em}
  .brand span{color:var(--accent)}
  .updated{color:var(--ink-2);font-size:14px;margin-top:2px}
  .period-label{color:var(--ink-2);font-size:14px;margin-left:4px}
  .note{color:var(--ink-3);font-size:12px;margin-top:6px;line-height:1.35}
  .post-note{color:var(--ink-2);font-size:13px;border-top:1px solid var(--line);padding-top:10px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .spacer{flex:1}
  .refresh{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
  .refresh:hover{border-color:var(--accent);color:var(--accent)}
  .refresh svg{width:15px;height:15px}
  .refresh.busy svg{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;min-width:0}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:600}
  .card .sub{color:var(--ink-3);font-size:13px;margin-bottom:16px}
  .kpi{grid-column:span 3}
  .kpi .label{color:var(--ink-2);font-size:14px}
  .kpi .value{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:8px 0 8px;font-variant-numeric:tabular-nums}
  .kpi .value small{font-size:22px;font-weight:600;color:var(--ink-2)}
  .delta{font-size:14px;font-variant-numeric:tabular-nums}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--ink-3)}
  .delta .ctx{color:var(--ink-3)}
  .chart{grid-column:span 6}
  .mix{grid-column:span 5}
  .bars{grid-column:span 7}
  .top{grid-column:span 12}
  .chart-box{position:relative;height:230px;display:flex;align-items:center;justify-content:center}
  .chart-box svg{flex:1}
  .chart-box svg{display:block;width:100%;height:100%;overflow:visible}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .chart-head .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
  .axis{fill:var(--ink-3);font-size:11px}
  .gridline{stroke:var(--line);stroke-width:1}
  .donut-row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .donut{width:190px;height:190px;flex:none}
  .legend{display:grid;gap:12px;flex:1;min-width:170px}
  .legend .row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}
  .legend .sw{width:12px;height:12px;border-radius:4px}
  .legend .pct{font-weight:700;font-variant-numeric:tabular-nums}
  .legend .n{color:var(--ink-3);font-size:13px;grid-column:2}
  .bar-list{display:grid;gap:18px}
  .bar-row .top-line{display:flex;justify-content:space-between;margin-bottom:7px}
  .bar-row .val{font-weight:700;font-variant-numeric:tabular-nums}
  .bar-row .muted{color:var(--ink-3);font-weight:400;font-size:13px;margin-left:6px}
  .track{height:12px;background:var(--accent-soft);border-radius:999px;overflow:hidden}
  .fill{height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease}
  .posts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .post{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .post .meta{display:flex;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:13px}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.viral{background:var(--accent);color:#fff}
  .badge.strong{background:var(--accent-soft);color:var(--accent)}
  .badge.normal{background:#f1eff0;color:var(--ink-2)}
  .post .title{font-weight:600;font-size:16px;line-height:1.3}
  .post .nums{display:flex;gap:22px;margin-top:auto}
  .post .nums div{display:flex;flex-direction:column}
  .post .nums b{font-size:22px;font-variant-numeric:tabular-nums}
  .post .nums span{color:var(--ink-3);font-size:12px}
  .empty{color:var(--ink-3);padding:24px 0;text-align:center}
  @media (max-width:980px){
    .kpi{grid-column:span 6}
    .chart,.mix,.bars{grid-column:span 12}
    .posts{grid-template-columns:1fr 1fr}
  }
  @media (max-width:640px){
    .wrap{padding:20px 16px 40px}
    .grid{gap:12px}
    .kpi,.chart,.mix,.bars,.top{grid-column:span 12}
    .posts{grid-template-columns:1fr}
    .card{padding:18px}
    .kpi .value{font-size:36px}
    .spacer{display:none}
    .seg{max-width:100%}
    .donut-row{justify-content:center}
  }
</style>
</head>

    <section class="card bars">

/* ===== Источник данных =====

var SHEET_ID = "13g6C4C53GXcmBibUeaEqvL4i7CsjDA1SVy1S2GwhfnE";

};

/* ===== Справочники ===== */
var NETS = { ig:"Инстаграм", vk:"ВКонтакте", max:"Макс", tg:"Телеграм", pin:"Пинтерест" };
var NET_IDS = Object.keys(NETS);
function netKey(s){
  s = String(s||"").toLowerCase().replace(/[^a-zа-яё]/g,"");
  if (!s) return null;
  if (/^(inst|инст|ig$|иг$)/.test(s)) return "ig";
  if (/^(vk|вк$|вконт|vkontakte)/.test(s)) return "vk";
  if (/^(max$|макс$)/.test(s)) return "max";
  if (/^(tg$|тг$|telegr|телегр)/.test(s)) return "tg";

}

];
function fmtKey(s){
  s = String(s||"").toLowerCase();
  if (/(рилс|reel|клип|clip|видео|video|шортс|short)/.test(s)) return "reels";

  return s ? "posts" : null;
}
var MON_NOM=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
var MON_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MON_DAT=["январю","февралю","марту","апрелю","маю","июню","июлю","августу","сентябрю","октябрю","ноябрю","декабрю"];
var MON_SHORT=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

/* ===== CSV ===== */
function parseCSV(text){
  text = String(text||"").replace(/^﻿/,"");
  var first=text.split("\n")[0], delim=(first.split(";").length>first.split(",").length)?";":",";
  var rows=[], row=[], cell="", q=false, i, c;
  for (i=0;i<text.length;i++){
    c=text[i];
    if (q){
      if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    } else if (c==='"') q=true;
    else if (c===delim) { row.push(cell); cell=""; }
    else if (c==="\n"||c==="\r"){ if (c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if (cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.map(function(r){ return r.map(function(x){ return x.trim(); }); })
             .filter(function(r){ return r.some(function(x){ return x!==""; }); });
}
function num(v){
  if (v==null) return NaN;
  var s=String(v).replace(/[\s  %₽]/g,"").replace(/[−–]/g,"-").replace(/,(?=\d{1,2}$)/,".").replace(/,/g,"");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
function parseDate(v){
  var s=String(v||"").trim().toLowerCase(), m;
  if ((m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],m[2]-1,+m[3]);
  if ((m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/))) return new Date(m[3].length===2?2000+ +m[3]:+m[3],m[2]-1,+m[1]);
  return null;
}
/* «Июль 26», «сентябрь 2026» → 1-е число месяца */
function parseMonth(s){
  s=String(s||"").toLowerCase();
  var i=MON_SHORT.findIndex(function(x){ return s.indexOf(x==="май"?"ма":x)===0; });
  if (i<0) { var d=parseDate(s); return d ? new Date(d.getFullYear(), d.getMonth(), 1) : null; }
  var y=(s.match(/(\d{2,4})\s*$/)||[])[1];
  y = y ? (y.length===2 ? 2000+ +y : +y) : new Date().getFullYear();
  return new Date(y, i, 1);
}

/* ===== Листы статистики: показатели в строках, периоды в столбцах, блоки по соцсетям ===== */
function metricKey(name){
  var l=name.toLowerCase();
  if (l.indexOf("прирост")===0) return "growth";
  if (l.indexOf("подписчик")===0) return "followers";
  if (l.indexOf("средний охват")>=0) return "avgReach";
  if (l.indexOf("охват")===0) return "reach";
  if (l.indexOf("просмотр")===0) return "views";
  if (l.indexOf("вовлеч")>=0) return (/%|er/.test(l)) ? "erPct" : "engagement";
  if (/лид|заявк/.test(l)) return "leads";
  if (/истори|stories|сторис/.test(l)) return "stories";
  if (l.indexOf("количество постов")>=0) return "posts";
  if (l.indexOf("количество публикаций")>=0) return "pubs";
  return null;
}
function wide(text, kind){
  var rows=parseCSV(text); if (!rows.length) return [];
  var h=0;
  for (var i=0;i<Math.min(rows.length,5);i++) if (/показател/i.test(rows[i][0])) { h=i; break; }
  var periods=[], prevStart=null;
  rows[h].forEach(function(lbl, col){
    if (!col || !lbl) return;
    var p={ label:lbl, col:col, nets:{}, total:{} }, m;
    if (kind==="monthly"){
      p.start=parseMonth(lbl); if (!p.start) return;
      p.end=new Date(p.start.getFullYear(), p.start.getMonth()+1, 1);
    } else {
      m=lbl.match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\s*[-–—]\s*(\d{1,2})\.(\d{1,2})/);
      if (!m) return;
      var y=m[3] ? (m[3].length===2?2000+ +m[3]:+m[3]) : (prevStart ? prevStart.getFullYear() : new Date().getFullYear());
      p.start=new Date(y, m[2]-1, +m[1]);
      if (prevStart && p.start<prevStart) p.start.setFullYear(y+1);           // переход через Новый год
      p.end=new Date(p.start.getFullYear(), m[5]-1, +m[4]+1);
      if (p.end<=p.start) p.end.setFullYear(p.end.getFullYear()+1);
      prevStart=p.start;
    }
    periods.push(p);
  });
  var section=null;
  rows.slice(h+1).forEach(function(r){
    var name=r[0]||""; if (!name) return;
    var vals=periods.map(function(p){ return num(r[p.col]); });
    var any=vals.some(ok), nk=netKey(name);
    if (!any && (nk || /общ/i.test(name))) { section = nk || "total"; return; }
    if (!section) return;
    var m=metricKey(name); if (!m) return;
    periods.forEach(function(p, i){
      if (!ok(vals[i])) return;
      var t = section==="total" ? p.total : (p.nets[section] = p.nets[section] || {});
      t[m]=vals[i];
    });
  });
  periods.forEach(function(p){
    p.filled = ok(p.total.leads) || NET_IDS.some(function(n){ var o=p.nets[n]; return o && Object.keys(o).length; });
  });
  return periods.filter(function(p){ return p.filled; });
}

/* ===== Журнал публикаций ===== */
function findCol(head, include){
  for (var i=0;i<head.length;i++){
    var h=head[i].toLowerCase();
    if (include.some(function(w){ return h.indexOf(w)>=0; })) return i;
  }
  return -1;
}
var K = {
  date:["дата","date"], net:["соцсет","сеть","платформ","площадк","network"],
  reach:["охват","reach"], views:["просмотр","view"],
  likes:["лайк","like"], comments:["коммент","comment"], saves:["сохран","save"], reactions:["реакц","reaction"],
  format:["формат","format"], topic:["тема","заголов","topic"], note:["вывод","итог"]
};
function contentTable(text){
  var rows=parseCSV(text); if (!rows.length) return [];
  var h=0;
  for (var i=0;i<Math.min(rows.length,5);i++) if (findCol(rows[i],K.net)>=0 && findCol(rows[i],K.date)>=0){ h=i; break; }
  var head=rows[h], c={};
  Object.keys(K).forEach(function(k){ c[k]=findCol(head,K[k]); });
  var out=[];
  rows.slice(h+1).forEach(function(r, idx){
    var net=netKey(r[c.net]); if (!net) return;
    function g(k){ return c[k]>=0 ? num(r[c[k]]) : NaN; }
    var o={ net:net, order:idx, date:parseDate(r[c.date]), views:g("views"), reach:g("reach"),
      likes:g("likes"), comments:g("comments"), saves:g("saves"), reactions:g("reactions"),
      formatRaw:r[c.format]||"", topic:c.topic>=0?r[c.topic]:"", note:c.note>=0?r[c.note]:"" };
    o.format=fmtKey(o.formatRaw);
    if (!ok(o.reach)) o.reach=o.views;      // охвата в журнале нет — берём просмотры
    out.push(o);
  });
  return out;
}

/* ===== Состояние ===== */
var DATA = { weekly:[], monthly:[], content:[] };
var state = { net:"all", period:"week", stamp:null, live:false };

function applyCSV(csv, at, live){
  var w=wide(csv.weekly||"","weekly"), m=wide(csv.monthly||"","monthly"), ct=contentTable(csv.content||"");
  if (!w.length && !m.length) return false;
  DATA.weekly=w; DATA.monthly=m; DATA.content=ct;
  state.stamp=at; state.live=live;
  return true;
}
function loadEmbedded(){
  var el=document.getElementById("csv-weekly");
  applyCSV({ weekly:el.textContent, monthly:document.getElementById("csv-monthly").textContent,
             content:document.getElementById("csv-content").textContent }, parseDate(el.getAttribute("data-snapshot")), false);
  try {
    var cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
    if (cached && cached.at && (!state.stamp || cached.at>state.stamp.getTime())) applyCSV(cached, new Date(cached.at), true);
  } catch(e){}
}

/* ===== Загрузка из таблицы ===== */
function fetchText(url){
  var ctrl = window.AbortController ? new AbortController() : null;
  var t = ctrl ? setTimeout(function(){ ctrl.abort(); }, 12000) : null;
  return fetch(url, { cache:"no-store", signal: ctrl?ctrl.signal:undefined }).then(function(r){
    if (t) clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(s){ if (/^\s*</.test(s)) throw new Error("not csv"); return s; });
}
function fetchSheet(kind){
  var urls=[];
  if (PUBLISHED[kind]) urls.push(PUBLISHED[kind]);
  SHEET_NAMES[kind].forEach(function(n){
    urls.push("https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&headers=1&sheet="+encodeURIComponent(n));
  });
  var i=0;
  function next(){ if (i>=urls.length) return Promise.resolve(""); return fetchText(urls[i++]).catch(next); }
  return next();
}
function refresh(){
  var btn=document.getElementById("refresh");
  if (btn.classList.contains("busy")) return;
  btn.classList.add("busy");
  Promise.all([fetchSheet("weekly"), fetchSheet("monthly"), fetchSheet("content")]).then(function(res){
    var csv={ weekly:res[0], monthly:res[1], content:res[2], at:Date.now() };
    if (applyCSV(csv, new Date(csv.at), true)){
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(csv)); } catch(e){}
      render();
    }
  }).catch(function(){ /* тихо остаёмся на текущих цифрах */ })
    .then(function(){ btn.classList.remove("busy"); });
}

/* ===== Расчёты ===== */
function ok(x){ return typeof x==="number" && isFinite(x); }
function sum(a,f){ return a.reduce(function(s,x){ var v=f(x); return s+(ok(v)?v:0); },0); }
function selNets(){ return state.net==="all" ? NET_IDS : [state.net]; }

/* Охват соцсети за столбец: охват → средний охват поста × число постов → просмотры. */
function reachIn(p, n){
  var o=p.nets[n]||{};
  if (ok(o.reach)) return o.reach;
  if (ok(o.avgReach) && ok(o.posts)) return o.avgReach*o.posts;
  return o.views;
}
function reachKind(n){
  return n==="vk" ? "охват" : n==="tg" ? "≈ средний охват поста × число постов" : "просмотры (охвата в таблице нет)";
}
/* Значение показателя сети по набору столбцов. */
function val(cols, n, m){
  var v=cols.map(function(p){ return m==="reachX" ? reachIn(p,n) : (p.nets[n]||{})[m]; }).filter(ok);
  if (!v.length) return NaN;
  if (m==="followers") return v[v.length-1];
  if (m==="erPct") return v.reduce(function(a,b){return a+b;},0)/v.length;
  return v.reduce(function(a,b){return a+b;},0);
}
function useTotalLeads(cols){ return state.net==="all" && cols.length && cols.every(function(p){ return ok(p.total.leads); }); }
function total(cols, m){
  if (m==="leads" && useTotalLeads(cols)) return sum(cols,function(p){ return p.total.leads; });
  var v=selNets().map(function(n){ return val(cols,n,m); }).filter(ok);
  return v.length ? v.reduce(function(a,b){return a+b;},0) : NaN;
}
/* Сравнение: прирост считаем только по сетям, у которых есть цифры в обоих периодах. */
function compare(cur, prev, m){
  var r={ v: total(cur,m) };
  if (!prev || !prev.length) return r;
  if (m==="leads" && useTotalLeads(cur) && useTotalLeads(prev)){ r.c=r.v; r.p=total(prev,m); return r; }
  var c=0, p=0, any=false;
  selNets().forEach(function(n){
    var a=val(cur,n,m), b=val(prev,n,m);
    if (ok(a)&&ok(b)){ c+=a; p+=b; any=true; }
  });
  if (any){ r.c=c; r.p=p; }
  return r;
}
/* ER из статистики: вовлечённость / просмотры × 100 (для телеграма — готовый ER из таблицы). */
function erStats(cols){
  var e=0, v=0, used=[];
  selNets().forEach(function(n){
    var a=val(cols,n,"engagement"), b=val(cols,n,"views");
    if (ok(a)&&ok(b)&&b>0){ e+=a; v+=b; used.push(n); }
  });
  if (v>0) return { v:e/v*100, used:used };
  if (state.net!=="all"){ var x=val(cols,state.net,"erPct"); if (ok(x)) return { v:x, used:[state.net], ready:true }; }
  return { v:NaN, used:[] };
}
/* ER публикации: (лайки + комментарии + сохранения) / просмотры × 100 */
function erPost(rows){
  var a=0, b=0;
  rows.forEach(function(r){
    var inter = ok(r.likes)||ok(r.comments)||ok(r.saves)
      ? (ok(r.likes)?r.likes:0)+(ok(r.comments)?r.comments:0)+(ok(r.saves)?r.saves:0) : r.reactions;
    var base = ok(r.views)&&r.views>0 ? r.views : r.reach;
    if (ok(inter)&&ok(base)&&base>0){ a+=inter; b+=base; }
  });
  return b>0 ? a/b*100 : NaN;
}

/* Текущий и прошлый период. */
function periodSel(){
  var W=DATA.weekly, M=DATA.monthly, P=state.period, s={};
  if (P==="week"){
    if (!W.length) return null;
    var w=W[W.length-1];
    s.cur=[w]; s.prev=W.length>1?[W[W.length-2]]:null;
    s.ctx="к прошлой неделе"; s.noPrev="первая неделя в таблице";
    s.title=dayRange(w.start, w.end);
    s.from=w.start; s.to=w.end;
  } else if (P==="month"){
    if (!M.length) return null;
    var m=M[M.length-1];
    s.cur=[m]; s.prev=M.length>1?[M[M.length-2]]:null;
    s.ctx=s.prev ? "к "+MON_DAT[s.prev[0].start.getMonth()] : ""; s.noPrev="первый месяц в таблице";
    s.title=MON_NOM[m.start.getMonth()]+" "+m.start.getFullYear();
    s.from=m.start; s.to=m.end;
  } else {
    var lastEnd = M.length ? M[M.length-1].end : null;
    s.cur=M.concat(W.filter(function(w){ return !lastEnd || w.start>=lastEnd; }));
    if (!s.cur.length) return null;
    var first=s.cur[0].start;
    s.prev=null; s.ctx=""; s.since="с "+MON_GEN[first.getMonth()];
    s.title=MON_NOM[first.getMonth()]+" "+first.getFullYear()+" — сейчас";
    s.from=null; s.to=null;
  }
  return s;
}
function dayRange(a, bExcl){
  var b=new Date(bExcl-86400000);
  return a.getMonth()===b.getMonth() ? a.getDate()+"–"+b.getDate()+" "+MON_GEN[b.getMonth()]
       : a.getDate()+" "+MON_GEN[a.getMonth()]+" – "+b.getDate()+" "+MON_GEN[b.getMonth()];
}

/* ===== Формат ===== */
function fmt(n){
  if (!ok(n)) return "—";
  var a=Math.abs(n);
  if (a>=1e7) return (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн";
  return Math.round(n).toLocaleString("ru-RU");
}
function short(n, step){
  var a=Math.abs(n), d=function(u){ return step ? Math.max(0,Math.min(2,Math.ceil(-Math.log10(step/u)))) : 1; };
  if (a>=1e6) return (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:d(1e6)})+"M";
  if (a>=1e3) return (n/1e3).toLocaleString("ru-RU",{maximumFractionDigits:d(1e3)})+"K";
  return Math.round(n).toLocaleString("ru-RU");
}
function pct(n,d){ return n.toLocaleString("ru-RU",{maximumFractionDigits:d==null?1:d}); }
function plural(n,a,b,c){ n=Math.abs(n)%100; var m=n%10; return n>10&&n<20?c:m===1?a:m>=2&&m<=4?b:c; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function dm(d){ return d ? String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0") : ""; }

function deltaHTML(cur, prev, ctx, isPct, noPrev){
  if (!ok(cur) || !ok(prev)) return '<div class="delta flat"><span class="ctx">'+esc(noPrev||"нет данных для сравнения")+'</span></div>';
  var d=cur-prev, txt;
  if (isPct) txt=pct(Math.abs(d))+" п.п.";
  else txt = prev ? pct(Math.abs(d/prev*100))+"%" : fmt(Math.abs(d));
  var cls = d>0?"up":d<0?"down":"flat", arrow = d>0?"↑":d<0?"↓":"→";
  var extra = (!isPct && prev) ? " ("+(d>0?"+":d<0?"−":"")+fmt(Math.abs(d))+")" : "";
  return '<div class="delta '+cls+'">'+arrow+" "+txt+extra+' <span class="ctx">'+esc(ctx)+'</span></div>';
}
function kpiHTML(label, val, delta, note){
  return '<div class="label">'+label+'</div><div class="value">'+val+'</div>'+delta+(note?'<div class="note">'+esc(note)+'</div>':"");
}

/* ===== График ===== */
function smoothPath(p){
  if (p.length<2) return p.length?"M"+p[0][0]+","+p[0][1]:"";
  var d="M"+p[0][0]+","+p[0][1];
  for (var i=0;i<p.length-1;i++){
    var p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2, t=0.18;
    var c1x=p1[0]+(p2[0]-p0[0])*t, c1y=p1[1]+(p2[1]-p0[1])*t;
    var c2x=p2[0]-(p3[0]-p1[0])*t, c2y=p2[1]-(p3[1]-p1[1])*t;
    var lo=Math.min(p1[1],p2[1]), hi=Math.max(p1[1],p2[1]);
    c1y=Math.max(lo,Math.min(hi,c1y)); c2y=Math.max(lo,Math.min(hi,c2y));
    d+=" C"+c1x+","+c1y+" "+c2x+","+c2y+" "+p2[0]+","+p2[1];
  }
  return d;
}
function niceTicks(min,max,count){
  if (min===max){ max=min+1; }
  var step=Math.pow(10,Math.floor(Math.log10((max-min)/count))), err=(max-min)/count/step;
  step*= err>=7.5?10:err>=3.5?5:err>=1.5?2:1;
  var lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for (var v=lo; v<=hi+step/2; v+=step) t.push(v);
  return t;
}
var gradId=0;
function lineChart(box, pts, name){
  box.innerHTML="";
  if (pts.length<2){ box.innerHTML='<div class="empty">'+(pts.length?"Пока одна точка — график появится со второго периода":"Нет данных")+'</div>'; return; }
  var vals=pts.map(function(p){ return p.v; });
  var W=box.clientWidth||600, H=box.clientHeight||230, L=48, R=14, T=10, B=26;
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), pad=(mx-mn)*0.15||mx*0.05||1;
  var ticks=niceTicks(Math.max(0,mn-pad), mx+pad, 3), y0=ticks[0], y1=ticks[ticks.length-1];
  function X(i){ return L+(W-L-R)*i/(pts.length-1); }
  function Y(v){ return T+(H-T-B)*(1-(v-y0)/(y1-y0)); }
  var P=pts.map(function(p,i){ return [X(i),Y(p.v)]; });
  var line=smoothPath(P), id="g"+(++gradId);
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#a25574" stop-opacity=".22"/><stop offset="1" stop-color="#a25574" stop-opacity="0"/></linearGradient></defs>';
  ticks.forEach(function(t){ var y=Y(t); svg+='<line class="gridline" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="axis" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+short(t, ticks[1]-ticks[0])+'</text>'; });
  var every=Math.max(1,Math.ceil(pts.length/(W<420?4:7)));
  pts.forEach(function(p,i){ if ((pts.length-1-i)%every===0) svg+='<text class="axis" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===pts.length-1?"end":"middle")+'">'+esc(p.axis)+'</text>'; });
  svg+='<path d="'+line+" L"+X(pts.length-1)+","+(H-B)+" L"+L+","+(H-B)+' Z" fill="url(#'+id+')"/>';
  svg+='<path d="'+line+'" fill="none" stroke="#a25574" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  P.forEach(function(q,i){ svg+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(i===P.length-1?4:3)+'" fill="#a25574" stroke="#fff" stroke-width="2"/>'; });
  svg+='<line class="hover-line" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="#a25574" stroke-opacity=".35" stroke-dasharray="3 3" style="display:none"/>';
  svg+='<circle class="hover-dot" r="5" fill="#fff" stroke="#a25574" stroke-width="2.5" style="display:none"/></svg><div class="tip"></div>';
  box.innerHTML=svg;
  var s=box.querySelector("svg"), tip=box.querySelector(".tip"), hl=s.querySelector(".hover-line"), hd=s.querySelector(".hover-dot");
  function move(e){
    var rect=s.getBoundingClientRect(), x=(e.clientX-rect.left)*W/rect.width;
    var i=Math.round((x-L)/((W-L-R)/(pts.length-1))); i=Math.max(0,Math.min(pts.length-1,i));
    hl.setAttribute("x1",P[i][0]); hl.setAttribute("x2",P[i][0]); hl.style.display="";
    hd.setAttribute("cx",P[i][0]); hd.setAttribute("cy",P[i][1]); hd.style.display="";
    tip.innerHTML=esc(pts[i].tip)+" · <b>"+fmt(vals[i])+"</b> "+name;
    var left=P[i][0]/W*rect.width; left=Math.max(70,Math.min(rect.width-70,left));
    tip.style.left=left+"px"; tip.style.top=(P[i][1]/H*rect.height)+"px"; tip.style.opacity=1;
  }
  function leave(){ hl.style.display="none"; hd.style.display="none"; tip.style.opacity=0; }
  s.addEventListener("pointermove",move); s.addEventListener("pointerleave",leave);
}
/* Ряд для графиков: по неделям, когда их в таблице от трёх; до этого — по месяцам. */
function chartSeries(m){
  var weekly=DATA.weekly.length>=3, cols=weekly?DATA.weekly:DATA.monthly, nets=selNets();
  var pts=[];
  cols.forEach(function(p, i){
    var v=0, any=false;
    nets.forEach(function(n){
      var x = m==="reachX" ? reachIn(p,n) : (p.nets[n]||{})[m];
      if (!ok(x) && m==="followers" && state.net==="all"){        // пропуск у одной сети — берём ближайшее значение
        for (var d=1; d<cols.length && !ok(x); d++) x=[cols[i-d],cols[i+d]].map(function(q){ return q&&(q.nets[n]||{})[m]; }).filter(ok)[0];
      }
      if (ok(x)){ v+=x; any=true; }
    });
    if (any) pts.push({ v:v, axis: weekly?dm(p.start):MON_SHORT[p.start.getMonth()],
      tip: weekly ? dayRange(p.start,p.end) : MON_NOM[p.start.getMonth()]+" "+p.start.getFullYear() });
  });
  return { pts:pts, weekly:weekly };
}

/* ===== Кольцо ===== */
function donut(counts){
  var total=counts.reduce(function(s,c){return s+c.n;},0), svg="", a=-Math.PI/2, R=86, r=60, cx=100, cy=100;
  var gap=counts.filter(function(c){return c.n;}).length>1?0.025:0;
  if (!total) svg='<circle cx="100" cy="100" r="73" fill="none" stroke="#ece7ea" stroke-width="26"/>';
  counts.forEach(function(c){
    if (!c.n) return;
    var ang=c.n/total*Math.PI*2;
    if (ang>=Math.PI*2-1e-6){ svg+='<circle cx="100" cy="100" r="73" fill="none" stroke="'+c.color+'" stroke-width="26"/>'; return; }
    var a0=a+gap/2, a1=a+ang-gap/2, large=a1-a0>Math.PI?1:0;
    function pt(rad,an){ return (cx+rad*Math.cos(an))+","+(cy+rad*Math.sin(an)); }
    svg+='<path d="M'+pt(R,a0)+" A"+R+","+R+" 0 "+large+" 1 "+pt(R,a1)+" L"+pt(r,a1)+" A"+r+","+r+" 0 "+large+" 0 "+pt(r,a0)+' Z" fill="'+c.color+'"><title>'+c.label+": "+c.n+'</title></path>';
    a+=ang;
  });
  svg+='<text x="100" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#1f1a1d">'+total+'</text>'+
       '<text x="100" y="120" text-anchor="middle" font-size="12" fill="#9a9196">'+plural(total,"публикация","публикации","публикаций")+'</text>';
  return svg;
}

/* ===== Рендер ===== */
function render(){
  var up=document.getElementById("updated"), now=new Date(), st=state.stamp;
  if (st && st.toDateString()===now.toDateString())
    up.textContent="обновлено сегодня"+(state.live?" в "+String(st.getHours()).padStart(2,"0")+":"+String(st.getMinutes()).padStart(2,"0"):"");
  else up.textContent = st ? "обновлено "+st.getDate()+" "+MON_GEN[st.getMonth()] : "обновлено сегодня";

  var s=periodSel();
  document.getElementById("period-label").textContent = s ? s.title : "";
  var ids=["followers","leads","reach","er"];
  if (!s){
    ids.forEach(function(id){ document.getElementById("kpi-"+id).innerHTML=kpiHTML("—","—",'<div class="delta flat"><span class="ctx">нет данных за период</span></div>'); });
  } else {
    var f=compare(s.cur,s.prev,"followers"), l=compare(s.cur,s.prev,"leads"), r=compare(s.cur,s.prev,"reachX");
    var fDelta;
    if (state.period==="all"){
      var base=0, cur=0, any=false;
      selNets().forEach(function(n){
        var vals=s.cur.map(function(p){ return (p.nets[n]||{}).followers; }).filter(ok);
        if (vals.length>1){ base+=vals[0]; cur+=vals[vals.length-1]; any=true; }
      });
      fDelta=deltaHTML(any?cur:NaN, any?base:NaN, s.since, false, "мало данных для сравнения");
    } else fDelta=deltaHTML(f.c,f.p,s.ctx,false,s.prev?null:s.noPrev);
    var allCtx = state.period==="all" ? '<div class="delta flat"><span class="ctx">'+esc("сумма "+s.since)+'</span></div>' : null;

    document.getElementById("kpi-followers").innerHTML=kpiHTML("Подписчики", fmt(f.v), fDelta);
    document.getElementById("kpi-leads").innerHTML=kpiHTML("Лиды", fmt(l.v), allCtx || deltaHTML(l.c,l.p,s.ctx,false,s.prev?null:s.noPrev));
    document.getElementById("kpi-reach").innerHTML=kpiHTML("Охваты", fmt(r.v), allCtx || deltaHTML(r.c,r.p,s.ctx,false,s.prev?null:s.noPrev),
      state.net==="all" ? "охват ВК, ≈ охват ТГ, просмотры ИГ, Макс, Пинтерест" : reachKind(state.net));

    var e=erStats(s.cur), ep=s.prev?erStats(s.prev):{v:NaN};
    var erNote = !e.used.length ? (state.net==="vk"||state.net==="max" ? "вовлечённости по этой сети в таблице нет" : "")
      : e.ready ? "ER из таблицы" : "вовлечённость / просмотры × 100"+(state.net==="all"?" · "+e.used.map(function(n){return NETS[n];}).join(", "):"");
    document.getElementById("kpi-er").innerHTML=kpiHTML("Вовлечённость (ER)", ok(e.v)?pct(e.v)+"<small>%</small>":"—",
      !ok(e.v) ? "" : state.period==="all" ? '<div class="delta flat"><span class="ctx">'+esc("в среднем "+s.since)+'</span></div>' : deltaHTML(e.v,ep.v,s.ctx,true,s.prev?null:s.noPrev), erNote);
  }

  ["followers","reachX"].forEach(function(m){
    var cs=chartSeries(m), id=m==="followers"?"f":"r";
    var sub = cs.weekly ? "по неделям" : "по месяцам · на недели график перейдёт, когда в таблице будет 3+ недели";
    if (m==="reachX" && state.net!=="all" && state.net!=="vk") sub=reachKind(state.net)+" · "+sub;
    document.getElementById("ch-"+id+"-sub").textContent=sub;
    document.getElementById("ch-"+id+"-last").textContent=cs.pts.length?fmt(cs.pts[cs.pts.length-1].v):"";
    lineChart(document.getElementById("ch-"+(m==="followers"?"followers":"reach")), cs.pts, m==="followers"?"подписчиков":"охват");
  });

  // публикации за период
  var c=DATA.content.filter(function(r){ return state.net==="all" || r.net===state.net; });
  if (s && s.from) c=c.filter(function(r){ return r.date && r.date>=s.from && r.date<s.to; });

  var counts=FORMATS.map(function(f){ return { key:f.key, label:f.label, color:f.color, n:c.filter(function(r){return r.format===f.key;}).length }; });
  var mixNote="по журналу публикаций";
  // телеграм ведёт счётчики постов и историй в статистике — добавляем их, если в журнале записей по нему нет
  if (s && (state.net==="all"||state.net==="tg") && !c.some(function(r){return r.net==="tg";})){
    var tp=val(s.cur,"tg","posts"), ts=val(s.cur,"tg","stories");
    if (ok(tp)||ok(ts)){ counts[1].n+=ok(tp)?tp:0; counts[2].n+=ok(ts)?ts:0; mixNote = c.length ? "журнал публикаций + счётчики телеграма" : "счётчики постов и историй телеграма"; }
  }
  var total=counts.reduce(function(a,x){return a+x.n;},0);
  document.getElementById("mix-sub").textContent="доля форматов · "+mixNote;
  document.getElementById("donut").innerHTML=donut(counts);
  document.getElementById("legend").innerHTML=counts.map(function(x){
    return '<div class="row"><span class="sw" style="background:'+x.color+'"></span><span>'+x.label+'</span><span class="pct">'+(total?Math.round(x.n/total*100):0)+'%</span>'+
           '<span class="n">'+x.n+" "+plural(x.n,"публикация","публикации","публикаций")+'</span></div>'; }).join("");

  var avgs=FORMATS.map(function(f){ var rr=c.filter(function(r){return r.format===f.key && ok(r.reach);});
    return { label:f.label, n:rr.length, avg: rr.length?sum(rr,function(r){return r.reach;})/rr.length:0, er:erPost(rr) }; });
  var maxAvg=Math.max.apply(null,avgs.map(function(a){return a.avg;}))||1;
  avgs.sort(function(a,b){return b.avg-a.avg;});
  document.getElementById("bars").innerHTML = c.length ? avgs.map(function(a){
    return '<div class="bar-row"><div class="top-line"><span>'+a.label+'</span><span class="val">'+(a.n?fmt(a.avg):"—")+
      '<span class="muted">'+(a.n?(ok(a.er)?"ER "+pct(a.er)+"% · ":"")+a.n+" "+plural(a.n,"публикация","публикации","публикаций"):"нет публикаций")+'</span></span></div>'+
      '<div class="track"><div class="fill" style="width:'+(a.avg/maxAvg*100)+'%"></div></div></div>'; }).join("")
    : '<div class="empty">В журнале «Контент» нет публикаций за этот период</div>';

  var withReach=c.filter(function(r){return ok(r.reach);}), avgAll=withReach.length?sum(withReach,function(r){return r.reach;})/withReach.length:0;
  var top=withReach.slice().sort(function(a,b){return b.reach-a.reach;}).slice(0,3);
  document.getElementById("posts").innerHTML = top.length ? top.map(function(p){
    var ratio=avgAll?p.reach/avgAll:1, b=ratio>=2?["viral","вирусный"]:ratio>=1.3?["strong","сильный"]:["normal","обычный"], er=erPost([p]);
    return '<article class="post"><div class="meta"><span>'+esc(NETS[p.net])+" · "+esc(p.formatRaw)+(p.date?" · "+dm(p.date):"")+'</span><span class="badge '+b[0]+'">'+b[1]+'</span></div>'+
      '<div class="title">'+esc(p.topic||"Без темы")+'</div>'+
      '<div class="nums"><div><b>'+fmt(p.reach)+'</b><span>просмотры</span></div><div><b>'+(ok(er)?pct(er)+"%":"—")+'</b><span>ER</span></div>'+
      (withReach.length>1?'<div><b>×'+pct(ratio)+'</b><span>к среднему</span></div>':"")+'</div>'+
      (p.note?'<div class="post-note">'+esc(p.note)+'</div>':"")+'</article>';
  }).join("") : '<div class="empty">В журнале «Контент» нет публикаций за этот период</div>';
}

/* ===== Управление ===== */
function seg(id, field){
  var el=document.getElementById(id);
  el.addEventListener("click", function(e){
    var b=e.target.closest("button"); if (!b) return;
    state[field]=b.getAttribute("data-v");
    Array.prototype.forEach.call(el.querySelectorAll("button"), function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
    render();
  });
}
seg("net","net"); seg("period","period");
document.getElementById("refresh").addEventListener("click", refresh);
var rt, lastW=window.innerWidth;
window.addEventListener("resize", function(){ if (window.innerWidth===lastW) return; lastW=window.innerWidth; clearTimeout(rt); rt=setTimeout(render,120); });

loadEmbedded();
render();
refresh(); // при открытии тихо пробуем подтянуть свежие цифры из таблицы
})();
</script>
</body>
